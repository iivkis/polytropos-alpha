version: '3'

# Local developer commands. AI agents must not execute build/test commands
# by default; see AGENTS.md. No CI is configured.
tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  fmt:
    desc: Format the entire Rust workspace (developer-run)
    cmds:
      - cargo fmt --all

  # Safe local preflight: format workspace sources, never commit or push.
  # Every lab generation/replay and workspace/lab test task depends on this.
  prepare:
    desc: Format Rust before laboratory runs and tests (no git changes beyond formatting)
    cmds:
      - task: fmt
      - cargo fmt --all -- --check

  check:
    desc: Autoformat Rust, type-check the workspace, and publish rustfmt-only changes safely on dev
    cmds:
      - |
        set -eu
        # Snapshot dirty source/index state before running rustfmt. Existing
        # developer edits must never become an automatic formatting commit.
        prior_rust="$(git status --porcelain --untracked-files=all -- '*.rs')"
        prior_index="$(git diff --cached --name-only)"
        task prepare
        cargo check --workspace --all-targets
        if git diff --quiet HEAD -- '*.rs'; then
          echo "check: no tracked Rust changes to publish."
          exit 0
        fi
        if [ -n "$prior_rust" ] || [ -n "$prior_index" ]; then
          echo "check: existing Rust edits or staged changes; formatted and checked, but not auto-pushing user work." >&2
          exit 0
        fi
        branch="$(git symbolic-ref --quiet --short HEAD)" || {
          echo "check: detached HEAD; skipping automatic push." >&2
          exit 0
        }
        if [ "$branch" != "dev" ]; then
          echo "check: only dev allows automatic formatting commits (current: $branch)." >&2
          exit 0
        fi
        git diff --check
        git remote get-url origin >/dev/null
        git fetch --quiet origin dev
        remote_head="$(git rev-parse --verify refs/remotes/origin/dev)"
        if [ "$(git rev-parse HEAD)" != "$remote_head" ]; then
          echo "check: dev differs from origin/dev; refusing to auto-push." >&2
          exit 1
        fi
        # Tracked .rs files only. Untracked sources and existing staged work
        # are never silently added to a formatting commit.
        git add -u -- '*.rs'
        if git diff --cached --quiet; then
          echo "check: no tracked Rust changes to commit."
          exit 0
        fi
        git commit -m "style(verineural): apply cargo fmt"
        git push origin HEAD:refs/heads/dev

  build:
    desc: Build the Rust workspace (developer-run)
    cmds:
      - cargo build --workspace

  test:
    desc: Run workspace tests (developer-run)
    deps: [prepare]
    cmds:
      - cargo test --workspace

  clippy:
    desc: Lint the workspace (developer-run)
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  doc:
    desc: Build Rust documentation locally (developer-run)
    cmds:
      - cargo doc --workspace --no-deps

  example-stage2:
    desc: Run the stage-2 Semantic Neural IR example (developer-run)
    cmds:
      - cargo run -p verineural --example stage2_graph

  proof-stage3:
    desc: Generate and check the stage-3 Lean 4 proof (developer-run)
    cmds:
      - cargo run -p verineural --example stage3_proof

  proof-scan-invariant:
    desc: Check consumer-owned ideal-Int step claims and the bounded recurrent invariant with Lean
    cmds:
      - cargo run -p verineural --example scan_invariant

  verify-inductive-invariant:
    desc: Check P1 arbitrary-horizon ideal-Int state invariant from one reusable consumer transition
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test inductive_invariant
      - cargo test -p verineural --test inductive_invariant -- --ignored

  verify-reusable-module-proof:
    desc: Check single/multi-output reusable definitions, per-instance obligations and global composition in Lean
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test reusable_module_definition
      - cargo test -p verineural --test reusable_module_definition -- --ignored

  auto-architecture:
    desc: Generate and audit all ideal-Int architecture/goal proofs and lower each supported output to NVPTX
    cmds:
      - cargo run -p verineural --example auto_architecture

  verify-auto-architecture:
    desc: Offline replay of current auto-build Semantic IR, SHA-256 manifest, Lean kernel/axioms and LLVM/PTX translation
    cmds:
      - cargo run -p verineural --example auto_architecture -- --verify

  proof-gated-select:
    desc: Check generic positive mask and conditional select with bounded Lean state invariant (GPU fail-closed)
    cmds:
      - cargo run -p verineural --example gated_select

  symbolic-shapes:
    desc: Verify two consumer symbolic-shape specializations with Lean and LLVM NVPTX (no GPU execution)
    cmds:
      - cargo run -p verineural --example symbolic_shapes

  verify-storage-semantics:
    desc: Check P1/P10 contiguous strides, reshape aliases and canonical storage identity
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test storage_semantics
      - cargo test -p verineural --test tensor_indexing

  gpu-multi-output:
    desc: Check one Lean model and capture/replay a shared four-output NVIDIA CUDA Graph
    cmds:
      - cargo run -p verineural --example multi_output_gpu

  verify-gpu-capabilities:
    desc: Check P1/P12 kernel-memory-translation coverage, fusion preconditions and audited Lean memory obligations
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test gpu_capability
      - cargo test -p verineural --test gpu_capability -- --ignored
      - cargo test -p verineural --test auto_build

  gpu-state-replay:
    desc: GPU acceptance for named stateful ModelExecution, five D2D feedback steps and exact FP32 results
    deps:
      - prepare
    cmds:
      - cargo run -p verineural --example stateful_model_gpu

  gpu-stage4:
    desc: Lower IR to PTX and run the CUDA stage-4 example (developer-run)
    cmds:
      - cargo run -p verineural --example stage4_gpu

  cert-stage5:
    desc: Run Lean, CUDA and the Stage 5 evidence bundle (developer-run)
    cmds:
      - cargo run -p verineural --example stage5_cert

  verify-stage5:
    desc: Recheck Stage 5 SHA-256 manifest and Lean source (developer-run)
    cmds:
      - cargo run -p verineural --example stage5_verify

  neural-stage6:
    desc: Execute Stage 6 residual FFN via Lean + CUDA and produce an evidence bundle (developer-run)
    cmds:
      - cargo run -p verineural --example stage6_ffn

  gpu-stage7:
    desc: Validate fusion and benchmark reusable CUDA Graph replay with CUDA events (developer-run)
    cmds:
      - cargo run -p verineural --example stage7_fusion

  verify-gpu-stage7:
    desc: Replay Stage 7 SHA-256 manifests and Lean proof checks without GPU execution (developer-run)
    cmds:
      - cargo run -p verineural --example stage7_fusion -- --verify

  gpu-stage7-bench:
    desc: Benchmark four CUDA Graph workload sizes, input rebinding, and FP32 bitwise checks (developer-run)
    cmds:
      - cargo run -p verineural --example stage7_benchmark --release

  numeric-stage8:
    desc: Check Stage 8 Lean/RNE and per-kernel Numeric Translation Validation before CUDA Graph execution
    cmds:
      - cargo run -p verineural --example stage8_exact

  verify-numeric-stage8:
    desc: Offline verify Stage 8 Lean, all per-kernel LLVM/PTX translation reports, FP32 bits and SHA-256
    cmds:
      - cargo run -p verineural --example stage8_exact -- --verify

  verify-numeric-branch:
    desc: Check P1 stable PositiveMask/SelectPositive RNE branch inheritance and fail-closed zero crossing
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test numeric_branch
      - cargo test -p verineural --test numeric_branch -- --ignored

  verify-numeric-state:
    desc: Check P1 fixed-horizon recurrent RNE contract carry and invariant state q scale
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test numeric_state
      - cargo test -p verineural --test numeric_state -- --ignored

  lab-stage9:
    desc: Build Stage 9 independent coupled-field research lab, Lean, CUDA Graph and DOT/PNG evidence
    deps: [prepare]
    cmds:
      - cargo run -p coupled-field-lab --example stage9_architecture

  verify-lab-stage9:
    desc: Offline reconstruct Stage 9 Semantic IR/DOT and check Lean, LLVM/PTX and SHA-256
    deps: [prepare]
    cmds:
      - cargo run -p coupled-field-lab --example stage9_architecture -- --verify

  lab-xor:
    desc: Check XOR MLP truth table via VeriNeural, Lean, NVPTX and CUDA Graph; write lab evidence
    deps: [prepare]
    cmds:
      - cargo run -p xor-lab --example xor_lab -- {{.CLI_ARGS}}

  verify-lab-xor:
    desc: Recheck XOR lab artifacts, Lean, translation and hashes without GPU
    deps: [prepare]
    cmds:
      - cargo run -p xor-lab --example xor_lab -- --verify {{.CLI_ARGS}}

  certified-build:
    desc: Stage 10 certified build dispatcher for --manifest-path selected consumer (no GPU launch)
    deps: [prepare]
    cmds:
      - cargo run -p verineural --bin cargo-verineural -- build --certified {{.CLI_ARGS}}

  verify-certified-build:
    desc: Stage 10 offline certified replay using --manifest-path and optional external pin
    deps: [prepare]
    cmds:
      - cargo run -p verineural --bin cargo-verineural -- verify --certified {{.CLI_ARGS}}

  verify-certified-stage10:
    desc: Tool-dependent Stage 10 acceptance for true/false Lean goals, identity and tamper
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test certified_build -- --ignored

  certified-xor:
    desc: Stage 10 proof-gated certified model build for XOR (CPU tools only, no GPU run)
    deps: [prepare]
    cmds:
      - cargo run -p xor-lab --example xor_certified -- {{.CLI_ARGS}}

  verify-certified-xor:
    desc: Offline Stage 10 replay for XOR (optional --pinned-sha256 <digest>)
    deps: [prepare]
    cmds:
      - cargo run -p xor-lab --example xor_certified -- --verify {{.CLI_ARGS}}

  certified-coupled:
    desc: Stage 10 proof-gated certified model build for CoupledField (no GPU execution)
    deps: [prepare]
    cmds:
      - cargo run -p coupled-field-lab --example coupled_field_certified -- {{.CLI_ARGS}}

  verify-certified-coupled:
    desc: Offline Stage 10 replay for CoupledField (optional --pinned-sha256 <digest>)
    deps: [prepare]
    cmds:
      - cargo run -p coupled-field-lab --example coupled_field_certified -- --verify {{.CLI_ARGS}}

  test-lab-xor:
    desc: Run CPU-only XOR consumer tests including one global proof and GPU compilation planning
    deps: [prepare]
    cmds:
      - cargo test -p xor-lab --all-targets

  verify-relational-predicates:
    desc: Lean kernel and axiom audit acceptance for true and deliberately false consumer relational claims
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test relational_predicates -- --ignored

  verify-pointwise-primitive:
    desc: Kernel-check independent user-defined atomic pointwise semantics and contracts
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test pointwise_primitive -- --ignored

  p0-acceptance:
    desc: Verify VN-P01..P06 supported-scope contracts, external primitive, composition and certified Lean trust boundary
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test relational_predicates
      - cargo test -p verineural --test pointwise_primitive
      - cargo test -p verineural --test auto_build
      - cargo test -p verineural --test relational_predicates -- --ignored
      - cargo test -p verineural --test pointwise_primitive -- --ignored
      - cargo run -p verineural --example auto_architecture
      - cargo run -p verineural --example auto_architecture -- --verify
      - cargo test -p verineural --test certified_build -- --ignored

  verify-tensor-reductions:
    desc: Lean-check axis-sum ideal semantics, nonnegative fold, and consumer contracts
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test tensor_reductions -- --ignored

  verify-tensor-slice:
    desc: Check P1 static axis slice host/IR semantics, Lean preservation and explicit GPU fail-closed
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test tensor_slice
      - cargo test -p verineural --test tensor_slice -- --ignored

  p2-consumers:
    desc: Exercise three independent P2 consumer architectures, positive/negative contracts and honest GPU profiles
    deps: [prepare]
    cmds:
      - cargo test -p verineural-consumer-acceptance --all-targets

  verify-p2-consumers:
    desc: Kernel-check P2 nested, bounded recurrent, custom primitive, tensor-heavy and deliberately false goals
    deps: [prepare]
    cmds:
      - cargo test -p verineural-consumer-acceptance --all-targets -- --ignored

  verify-stage10-proof-boundary:
    desc: Stage 10 publication rollback, Lean relational composition, and GPU translation/memory fail-closed checks
    deps: [prepare]
    cmds:
      - cargo test -p verineural --lib interrupted_legacy_migration
      - cargo test -p verineural --lib interrupted_fresh_publication
      - cargo test -p verineural --test relational_predicates
      - cargo test -p verineural --test relational_predicates -- --ignored
      - task verify-gpu-capabilities
      - task verify-certified-stage10

  verify-all-acceptance:
    desc: Developer-run combined Stage 1-4 regression, Lean, certified bundle and NVIDIA rotating acceptance
    cmds:
      - task check
      - task test
      - task clippy
      - task verify-api-acceptance
      - task verify-stage10-proof-boundary
      - task gpu-state-replay
      - task verify-lab-rotating-gpu
      - task lab-rotating

  verify-api-acceptance:
    desc: Developer-run P0/P1/P2 API contracts, real Lean checks, and independent consumer cases
    cmds:
      - task p0-acceptance
      - task verify-reusable-module-proof
      - task p2-consumers
      - task verify-p2-consumers

  verify-lab-rotating-gpu:
    desc: NVIDIA acceptance for typed ArgMax output and independent rotating-matrices CUDA Graph parity
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test tensor_indexing -- --ignored
      - cargo test -p rotating-matrices-lab --test gpu_parity
      - cargo test -p rotating-matrices-lab --test gpu_parity -- --ignored

  lab-rotating:
    desc: Inspect and train rotating-matrices; deterministic routing uses the unified structural/index CUDA Graph
    deps: [prepare]
    cmds:
      - cargo run -p rotating-matrices-lab --example rotating_matrices -- --inspect
      - cargo run -p rotating-matrices-lab --example rotating_matrices -- --train 128

  inspect-lab-rotating:
    desc: Inspect rotating cores and export diagnostic Semantic IR without GPU or Lean
    deps: [prepare]
    cmds:
      - cargo run -p rotating-matrices-lab --example rotating_matrices -- --inspect

  test-lab-rotating:
    desc: Developer-run CPU tests for 40 operations, byte dictionary, rotation and IR shapes
    deps: [prepare]
    cmds:
      - cargo test -p rotating-matrices-lab --all-targets

  train-lab-rotating:
    desc: Train rotating cores and eight-way router with CUDA Graph and report held-out accuracy
    deps: [prepare]
    cmds:
      - cargo run -p rotating-matrices-lab --example rotating_matrices -- --train {{.CLI_ARGS}}

  certify-lab-rotating:
    desc: Build rotating-matrices structural/index evidence with Lean and NVPTX (no GPU launch)
    deps: [prepare]
    cmds:
      - cargo run -p rotating-matrices-lab --example rotating_matrices -- --certify-architecture

  lab-torus16-mix:
    desc: Inspect the VeriNeural Torus16-Mix operator and execute the Tensor host reference
    deps: [prepare]
    cmds:
      - cargo run -p torus16-mix-lab --example torus16_mix -- --inspect

  inspect-ir-torus16-mix:
    desc: Print the complete canonical Torus16-Mix operator Semantic IR
    deps: [prepare]
    cmds:
      - cargo run -p torus16-mix-lab --example torus16_mix -- --ir

  test-lab-torus16-mix:
    desc: Run Torus16-Mix plus reusable one-row structural GPU contract tests (no PyTorch)
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test structural_last_row
      - cargo test -p verineural --test pointwise_gpu
      - cargo test -p torus16-mix-lab

  verify-gpu-structural-last-row:
    desc: Run ignored NVIDIA acceptance for generic SliceAxis/BroadcastTo/Concat(1) in one CUDA Graph
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test structural_last_row -- --ignored --nocapture

  lab-torus16-mix-gpu:
    desc: Run all eight Torus16-Mix roles in one CUDA Graph with explicit approximate exp and compare Tensor oracle
    deps: [prepare]
    cmds:
      - cargo run -p torus16-mix-lab --example torus16_mix -- --gpu

  verify-gpu-torus16-mix:
    desc: NVIDIA GPU acceptance for Torus16-Mix full multi-output forward (no PyTorch)
    deps: [prepare]
    cmds:
      - cargo test -p torus16-mix-lab --test gpu_forward -- --ignored --nocapture

  pointwise-binary-chain-fusion:
    desc: Structural checks for generic two-operation Add/Mul CUDA fusion
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test binary_pointwise_fusion

  verify-gpu-binary-chain-fusion:
    desc: NVIDIA bitwise parity for opt-in two-operation Add/Mul fusion
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test binary_pointwise_fusion -- --ignored --nocapture

  pointwise-three-op-fusion:
    desc: Structural contracts for three-op strict FP32 pointwise CUDA fusion
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test mul_add_mul_fusion

  verify-gpu-three-op-fusion:
    desc: NVIDIA bitwise equivalence for twelve Mul-Add-Mul operand layouts
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test mul_add_mul_fusion -- --ignored --nocapture

  pointwise-mul-add-fusion:
    desc: Validate checked opt-in Mul+Add CUDA fusion and its reverse-mode boundaries
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test mul_add_fusion

  verify-gpu-mul-add-fusion:
    desc: NVIDIA bitwise fused vs unfused Mul-then-Add parity
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test mul_add_fusion -- --ignored --nocapture

  temporal-bptt-stage:
    desc: Test generic recurrent IR unroll, through-time dependency and full EMA4 parameter inventory
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test temporal
      - cargo test -p torus16-mix-lab --test ema4

  verify-gpu-temporal-bptt:
    desc: Verify a two-step recurrent gradient with a hand-derived NVIDIA CUDA oracle
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test temporal -- --ignored --nocapture

  verify-gpu-batch-transfers:
    desc: NVIDIA acceptance for partial H2D updates, selective batched D2H and old API parity
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test gpu_batch_transfers -- --ignored --nocapture

  test-lab-torus16-ema4-checkpoint:
    desc: CPU round-trip, corruption rejection and AdamW restart continuity for EMA4 snapshots
    deps: [prepare]
    cmds:
      - cargo test -p torus16-mix-lab --lib ema4_checkpoint -- --nocapture

  train-lab-torus16-ema4-bptt:
    desc: Release-optimized BPTT with batched transfers and per-stage wall-clock profiling
    deps: [prepare]
    cmds:
      - cargo run --release -p torus16-mix-lab --example ema4_bptt

  autodiff-stage:
    desc: Validate architecture-neutral reverse-mode IR rules, finite difference checks and atomic AdamW
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test autodiff

  verify-gpu-autodiff:
    desc: Validate reverse-mode MatMul/fanout gradients through CUDA Graph against independent oracle
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test autodiff -- --ignored --nocapture

  train-lab-torus16-ema4:
    desc: GPU CE to reverse-IR VJP to host AdamW, one-token truncated gradient for final-beta only
    deps: [prepare]
    cmds:
      - cargo run -p torus16-mix-lab --example ema4_train

  lab-torus16-ema4:
    desc: Inspect the 4-layer streaming EMA4-LM architecture built from VeriNeural primitives
    deps: [prepare]
    cmds:
      - cargo run -p torus16-mix-lab --example ema4 -- --inspect

  test-lab-torus16-ema4:
    desc: Validate research-sized parameter count, all named states and causal CPU reference
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test pointwise_gpu
      - cargo test -p torus16-mix-lab --test ema4

  lab-torus16-ema4-gpu:
    desc: Execute three EMA4-LM autoregressive steps through one persistent CUDA Graph
    deps: [prepare]
    cmds:
      - cargo run -p torus16-mix-lab --example ema4 -- --gpu

  verify-gpu-torus16-ema4:
    desc: NVIDIA acceptance for streaming EMA4-LM logits and on-device EMA feedback
    deps: [prepare]
    cmds:
      - cargo test -p torus16-mix-lab --test ema4 -- --ignored --nocapture

  certify-lab-torus16-mix:
    desc: Fail closed on unsupported certified numerical semantics of pointwise Exp/Div
    deps: [prepare]
    cmds:
      - cargo run -p torus16-mix-lab --example torus16_mix -- --certify

