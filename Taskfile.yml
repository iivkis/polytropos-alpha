  verify-pointwise-primitive:
    desc: Kernel-check independent user-defined atomic pointwise semantics and contracts
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test pointwise_primitive -- --ignored

  p0-acceptance:
    desc: Verify VN-P01..P06 supported-scope contracts, external primitive, composition and certified Lean trust boundary
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test relational_predicates
      - cargo test -p verineural --test pointwise_primitive
      - cargo test -p verineural --test auto_build
      - cargo test -p verineural --test relational_predicates -- --ignored
      - cargo test -p verineural --test pointwise_primitive -- --ignored
      - cargo run -p verineural --example auto_architecture
      - cargo run -p verineural --example auto_architecture -- --verify
      - cargo test -p verineural --test certified_build -- --ignored

  verify-tensor-reductions:
    desc: Lean-check axis-sum ideal semantics, nonnegative fold, and consumer contracts
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test tensor_reductions -- --ignored

  verify-tensor-slice:
    desc: Check P1 static axis slice host/IR semantics, Lean preservation and explicit GPU fail-closed
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test tensor_slice
      - cargo test -p verineural --test tensor_slice -- --ignored

  p2-consumers:
    desc: Exercise three independent P2 consumer architectures, positive/negative contracts and honest GPU profiles
    deps: [prepare]
    cmds:
      - cargo test -p verineural-consumer-acceptance --all-targets

  verify-p2-consumers:
    desc: Kernel-check P2 nested, bounded recurrent, custom primitive, tensor-heavy and deliberately false goals
    deps: [prepare]
    cmds:
      - cargo test -p verineural-consumer-acceptance --all-targets -- --ignored

  verify-stage10-proof-boundary:
    desc: Stage 10 publication rollback, Lean relational composition, and GPU translation/memory fail-closed checks
    deps: [prepare]
    cmds:
      - cargo test -p verineural --lib interrupted_legacy_migration
      - cargo test -p verineural --lib interrupted_fresh_publication
      - cargo test -p verineural --test relational_predicates
      - cargo test -p verineural --test relational_predicates -- --ignored
      - task verify-gpu-capabilities
      - task verify-certified-stage10

  verify-all-acceptance:
    desc: Developer-run combined Stage 1-4 regression, Lean, certified bundle and NVIDIA rotating acceptance
    cmds:
      - task check
      - task test
      - task clippy
      - task verify-api-acceptance
      - task verify-stage10-proof-boundary
      - task gpu-state-replay
      - task verify-lab-rotating-gpu
      - task lab-rotating

  verify-api-acceptance:
    desc: Developer-run P0/P1/P2 API contracts, real Lean checks, and independent consumer cases
    cmds:
      - task p0-acceptance
      - task verify-reusable-module-proof
      - task p2-consumers
      - task verify-p2-consumers

  verify-lab-rotating-gpu:
    desc: NVIDIA acceptance for typed ArgMax output and independent rotating-matrices CUDA Graph parity
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test tensor_indexing -- --ignored
      - cargo test -p rotating-matrices-lab --test gpu_parity
      - cargo test -p rotating-matrices-lab --test gpu_parity -- --ignored

  lab-rotating:
    desc: Inspect and train rotating-matrices; deterministic routing uses the unified structural/index CUDA Graph
    deps: [prepare]
    cmds:
      - cargo run -p rotating-matrices-lab --example rotating_matrices -- --inspect
      - cargo run -p rotating-matrices-lab --example rotating_matrices -- --train 128

  inspect-lab-rotating:
    desc: Inspect rotating cores and export diagnostic Semantic IR without GPU or Lean
    deps: [prepare]
    cmds:
      - cargo run -p rotating-matrices-lab --example rotating_matrices -- --inspect

  test-lab-rotating:
    desc: Developer-run CPU tests for 40 operations, byte dictionary, rotation and IR shapes
    deps: [prepare]
    cmds:
      - cargo test -p rotating-matrices-lab --all-targets

  train-lab-rotating:
    desc: Train rotating cores and eight-way router with CUDA Graph and report held-out accuracy
    deps: [prepare]
    cmds:
      - cargo run -p rotating-matrices-lab --example rotating_matrices -- --train {{.CLI_ARGS}}

  certify-lab-rotating:
    desc: Build rotating-matrices structural/index evidence with Lean and NVPTX (no GPU launch)
    deps: [prepare]
    cmds:
      - cargo run -p rotating-matrices-lab --example rotating_matrices -- --certify-architecture

  lab-torus16-mix:
    desc: Inspect the VeriNeural Torus16-Mix operator and execute the Tensor host reference
    deps: [prepare]
    cmds:
      - cargo run -p torus16-mix-lab --example torus16_mix -- --inspect

  inspect-ir-torus16-mix:
    desc: Print the complete canonical Torus16-Mix operator Semantic IR
    deps: [prepare]
    cmds:
      - cargo run -p torus16-mix-lab --example torus16_mix -- --ir

  test-lab-torus16-mix:
    desc: Run Torus16-Mix plus reusable one-row structural GPU contract tests (no PyTorch)
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test structural_last_row
      - cargo test -p verineural --test pointwise_gpu
      - cargo test -p torus16-mix-lab

  verify-gpu-structural-last-row:
    desc: Run ignored NVIDIA acceptance for generic SliceAxis/BroadcastTo/Concat(1) in one CUDA Graph
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test structural_last_row -- --ignored --nocapture

  lab-torus16-mix-gpu:
    desc: Run all eight Torus16-Mix roles in one CUDA Graph with explicit approximate exp and compare Tensor oracle
    deps: [prepare]
    cmds:
      - cargo run -p torus16-mix-lab --example torus16_mix -- --gpu

  verify-gpu-torus16-mix:
    desc: NVIDIA GPU acceptance for Torus16-Mix full multi-output forward (no PyTorch)
    deps: [prepare]
    cmds:
      - cargo test -p torus16-mix-lab --test gpu_forward -- --ignored --nocapture

  pointwise-binary-chain-fusion:
    desc: Structural checks for generic two-operation Add/Mul CUDA fusion
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test binary_pointwise_fusion

  verify-gpu-binary-chain-fusion:
    desc: NVIDIA bitwise parity for opt-in two-operation Add/Mul fusion
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test binary_pointwise_fusion -- --ignored --nocapture

  pointwise-three-op-fusion:
    desc: Structural contracts for three-op strict FP32 pointwise CUDA fusion
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test mul_add_mul_fusion

  verify-gpu-three-op-fusion:
    desc: NVIDIA bitwise equivalence for twelve Mul-Add-Mul operand layouts
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test mul_add_mul_fusion -- --ignored --nocapture

  pointwise-mul-add-fusion:
    desc: Validate checked opt-in Mul+Add CUDA fusion and its reverse-mode boundaries
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test mul_add_fusion

  verify-gpu-mul-add-fusion:
    desc: NVIDIA bitwise fused vs unfused Mul-then-Add parity
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test mul_add_fusion -- --ignored --nocapture

  temporal-bptt-stage:
    desc: Test generic recurrent IR unroll, through-time dependency and full EMA4 parameter inventory
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test temporal
      - cargo test -p torus16-mix-lab --test ema4

  verify-gpu-temporal-bptt:
    desc: Verify a two-step recurrent gradient with a hand-derived NVIDIA CUDA oracle
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test temporal -- --ignored --nocapture

  verify-gpu-batch-transfers:
    desc: NVIDIA acceptance for partial H2D updates, selective batched D2H and old API parity
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test gpu_batch_transfers -- --ignored --nocapture

  test-lab-torus16-ema4-checkpoint:
    desc: CPU round-trip, corruption rejection and AdamW restart continuity for EMA4 snapshots
    deps: [prepare]
    cmds:
      - cargo test -p torus16-mix-lab --lib ema4_checkpoint -- --nocapture

  train-lab-torus16-ema4-bptt:
    desc: Release-optimized BPTT with batched transfers and per-stage wall-clock profiling
    deps: [prepare]
    cmds:
      - cargo run --release -p torus16-mix-lab --example ema4_bptt

  verify-gpu-p2-equivalence:
    desc: NVIDIA P2 acceptance - D2D/host feedback, fused/unfused FP32, EMA4 uninterrupted vs checkpoint resume
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test gpu_feedback -- --ignored --nocapture
      - cargo test -p verineural --test mul_add_fusion -- --ignored --nocapture
      - cargo test -p verineural --test mul_add_mul_fusion -- --ignored --nocapture
      - cargo test -p verineural --test binary_pointwise_fusion -- --ignored --nocapture
      - |
        set -eu
        # Never read, overwrite or resume the user's normal training file.
        parity_dir="$(mktemp -d "${TMPDIR:-/tmp}/verineural-ema4-p2.XXXXXX")"
        trap 'status=$?; if [ "$status" -eq 0 ]; then rm -rf "$parity_dir"; else printf "P2 logs/checkpoints retained at %s\n" "$parity_dir" >&2; fi' EXIT
        unset TORUS16_FRESH TORUS16_VERIFY_FUSION TORUS16_BENCH_COMPARE TORUS16_BENCH_FUSED TORUS16_CORPUS TORUS16_GPU_ADAMW TORUS16_METRIC_EVERY TORUS16_THREADS_PER_BLOCK TORUS16_LLC_OPT TORUS16_REUSE_HOLDOUT
        export TORUS16_BPTT=2 TORUS16_VAL_LIMIT=2 TORUS16_CHECKPOINT_EVERY=2
        echo "P2 (1/3): full EMA4 fused/unfused parity, then two training windows"
        TORUS16_FRESH=1 TORUS16_VERIFY_FUSION=1 TORUS16_TRAIN_WINDOWS=2 TORUS16_CHECKPOINT="$parity_dir/resumed.ckpt" \
          cargo run --release -p torus16-mix-lab --example ema4_bptt >"$parity_dir/first.log" 2>&1 || { cat "$parity_dir/first.log"; exit 1; }
        grep -q '^fusion_parity=PASS .*scope=EMA4_logits_gradients_terminal_states$' "$parity_dir/first.log"
        grep -q '^train_window=1 .*optimizer_step=2 ' "$parity_dir/first.log"
        echo "P2 (2/3): resume the two-window checkpoint to four windows"
        TORUS16_TRAIN_WINDOWS=4 TORUS16_CHECKPOINT="$parity_dir/resumed.ckpt" \
          cargo run --release -p torus16-mix-lab --example ema4_bptt >"$parity_dir/resume.log" 2>&1 || { cat "$parity_dir/resume.log"; exit 1; }
        grep -q '^checkpoint_resumed=.*completed_windows=2$' "$parity_dir/resume.log"
        grep -q '^train_window=3 .*optimizer_step=4 ' "$parity_dir/resume.log"
        echo "P2 (3/3): continuous four-window training from a fresh initialization"
        TORUS16_FRESH=1 TORUS16_TRAIN_WINDOWS=4 TORUS16_CHECKPOINT="$parity_dir/continuous.ckpt" \
          cargo run --release -p torus16-mix-lab --example ema4_bptt >"$parity_dir/continuous.log" 2>&1 || { cat "$parity_dir/continuous.log"; exit 1; }
        grep -q '^train_window=3 .*optimizer_step=4 ' "$parity_dir/continuous.log"
        sed -n '/^train_window=/s/ end_to_end_step_ms=.*$//p' "$parity_dir/first.log" >"$parity_dir/observed.log"
        sed -n '/^train_window=/s/ end_to_end_step_ms=.*$//p' "$parity_dir/resume.log" >>"$parity_dir/observed.log"
        sed -n '/^train_window=/s/ end_to_end_step_ms=.*$//p' "$parity_dir/continuous.log" >"$parity_dir/expected.log"
        if ! cmp -s "$parity_dir/observed.log" "$parity_dir/expected.log"; then
          echo "FAIL: per-window EMA4 CE/BPC or optimizer step differs" >&2
          diff -u "$parity_dir/expected.log" "$parity_dir/observed.log" || true
          exit 1
        fi
        if ! cmp -s "$parity_dir/resumed.ckpt" "$parity_dir/continuous.ckpt"; then
          echo "FAIL: checkpoint differs (parameters, recurrent states, AdamW, cursor)" >&2
          exit 1
        fi
        echo "PASS: EMA4 fused/unfused logits, gradients and terminal states match at FP32 bit level"
        echo "PASS: uninterrupted and checkpoint-resumed training match per-window CE/BPC and optimizer steps"
        echo "PASS: final EMA4 checkpoints are bit-identical, including 271 parameter tensors, recurrent states and AdamW"

  verify-gpu-dual-pointwise-outputs:
    desc: Check observable dual-output RNE fusion with structural tests and NVIDIA CUDA Graph parity
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test dual_pointwise_outputs
      - cargo test -p verineural --test dual_pointwise_outputs -- --ignored --nocapture

  verify-gpu-diamond-fusion:
    desc: Structural and NVIDIA bitwise acceptance for four-op rounded diamond fusion with selected output
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test mul_diamond_add_fusion
      - cargo test -p verineural --test mul_diamond_add_fusion -- --ignored --nocapture

  verify-gpu-four-op-fusion:
    desc: Structural and NVIDIA bitwise acceptance for generic rounded four-operation pointwise fusion
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test mul_mul_add_div_fusion
      - cargo test -p verineural --test mul_mul_add_div_fusion -- --ignored --nocapture

  verify-gpu-sqrt-add-div-fusion:
    desc: Structural and NVIDIA bitwise acceptance for generic 3-operation rounded Sqrt/Add/Div fusion
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test sqrt_add_div_fusion
      - cargo test -p verineural --test sqrt_add_div_fusion -- --ignored --nocapture

  verify-gpu-independent-batch:
    desc: NVIDIA accept independent CUDA Graph session preparation, pending IO guard, and bitwise serial/parallel equivalence
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test gpu_independent_batch independent_replay_matches_serial_and_rejects_pending_access -- --ignored --nocapture

  benchmark-gpu-independent-batch:
    desc: Measure four independent CUDA Graphs serial vs queued on separate non-blocking streams
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test gpu_independent_batch independent_streams_report_serial_vs_queued_wall_time -- --ignored --nocapture

  verify-gpu-adamw:
    desc: Experimental generic CUDA Graph AdamW, host numeric oracle, GPU restart and EMA4 checkpoint parity
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test gpu_adamw
      - cargo test -p verineural --test gpu_adamw -- --ignored --nocapture
      - |
        set -eu
        parity_dir="$(mktemp -d "${TMPDIR:-/tmp}/verineural-gpu-adamw.XXXXXX")"
        trap 'status=$?; if [ "$status" -eq 0 ]; then rm -rf "$parity_dir"; else printf "GPU AdamW logs and checkpoint retained at %s\n" "$parity_dir" >&2; fi' EXIT
        unset TORUS16_FRESH TORUS16_CORPUS TORUS16_VERIFY_FUSION TORUS16_BENCH_COMPARE TORUS16_BENCH_FUSED TORUS16_METRIC_EVERY TORUS16_THREADS_PER_BLOCK TORUS16_LLC_OPT TORUS16_REUSE_HOLDOUT
        export TORUS16_GPU_ADAMW=1 TORUS16_BPTT=2 TORUS16_VAL_LIMIT=2 TORUS16_CHECKPOINT_EVERY=2
        TORUS16_FRESH=1 TORUS16_TRAIN_WINDOWS=2 TORUS16_CHECKPOINT="$parity_dir/resumed.ckpt" \
          cargo run --release -p torus16-mix-lab --example ema4_bptt >"$parity_dir/first.log" 2>&1 || { cat "$parity_dir/first.log"; exit 1; }
        TORUS16_TRAIN_WINDOWS=4 TORUS16_CHECKPOINT="$parity_dir/resumed.ckpt" \
          cargo run --release -p torus16-mix-lab --example ema4_bptt >"$parity_dir/resume.log" 2>&1 || { cat "$parity_dir/resume.log"; exit 1; }
        grep -q '^checkpoint_resumed=.*completed_windows=2$' "$parity_dir/resume.log"
        TORUS16_FRESH=1 TORUS16_TRAIN_WINDOWS=4 TORUS16_CHECKPOINT="$parity_dir/continuous.ckpt" \
          cargo run --release -p torus16-mix-lab --example ema4_bptt >"$parity_dir/continuous.log" 2>&1 || { cat "$parity_dir/continuous.log"; exit 1; }
        grep -q 'optimizer_backend=GPU_IR$' "$parity_dir/continuous.log"
        sed -n '/^train_window=/s/ end_to_end_step_ms=.*$//p' "$parity_dir/first.log" >"$parity_dir/observed.log"
        sed -n '/^train_window=/s/ end_to_end_step_ms=.*$//p' "$parity_dir/resume.log" >>"$parity_dir/observed.log"
        sed -n '/^train_window=/s/ end_to_end_step_ms=.*$//p' "$parity_dir/continuous.log" >"$parity_dir/expected.log"
        diff -u "$parity_dir/expected.log" "$parity_dir/observed.log"
        cmp "$parity_dir/resumed.ckpt" "$parity_dir/continuous.ckpt"
        echo "PASS: GPU AdamW 4-step checkpoint/resume matches uninterrupted training bit-for-bit"
        echo "PASS: GPU AdamW original parameters and optimizer moments survive checkpoint/resume"

  benchmark-torus16-holdout-reuse:
    desc: Compare fresh and reused holdout GPU sessions, requiring exact validation, test and checkpoint parity
    deps: [prepare]
    cmds:
      - |
        set -eu
        bench_dir="$(mktemp -d "${TMPDIR:-/tmp}/torus16-holdout.XXXXXX")"
        trap 'status=$?; if [ "$status" -eq 0 ]; then rm -rf "$bench_dir"; else printf "Holdout logs and checkpoints retained at %s\n" "$bench_dir" >&2; fi' EXIT
        unset TORUS16_FRESH TORUS16_BPTT TORUS16_TRAIN_WINDOWS TORUS16_VAL_LIMIT TORUS16_TEST_LIMIT TORUS16_EVAL_EVERY TORUS16_CHECKPOINT_EVERY TORUS16_CORPUS TORUS16_MATRIX_MODE TORUS16_ROLE_INIT TORUS16_MATRIX_SEED TORUS16_BENCH_COMPARE TORUS16_VERIFY_FUSION TORUS16_BENCH_FUSED TORUS16_INITIAL_PROBE_PATH TORUS16_GPU_FEEDBACK_EVENTS TORUS16_THREADS_PER_BLOCK TORUS16_LLC_OPT TORUS16_METRIC_EVERY TORUS16_REUSE_HOLDOUT
        export TORUS16_GPU_ADAMW=1 TORUS16_BPTT=2 TORUS16_TRAIN_WINDOWS=256 TORUS16_VAL_LIMIT=2 TORUS16_TEST_LIMIT=2 TORUS16_EVAL_EVERY=64 TORUS16_CHECKPOINT_EVERY=64 TORUS16_THREADS_PER_BLOCK=256 TORUS16_METRIC_EVERY=32
        for mode in fresh reused; do
          printf '\nholdout_mode=%s\n' "$mode"
          if [ "$mode" = reused ]; then export TORUS16_REUSE_HOLDOUT=1; else unset TORUS16_REUSE_HOLDOUT; fi
          TORUS16_FRESH=1 TORUS16_CHECKPOINT="$bench_dir/$mode.ckpt" \
            cargo run --release -p torus16-mix-lab --example ema4_bptt >"$bench_dir/$mode.log" 2>&1 || { cat "$bench_dir/$mode.log"; exit 1; }
          grep '^holdout_session_mode=' "$bench_dir/$mode.log"
          grep '^training_total_s=' "$bench_dir/$mode.log"
          grep '^validation_window=' "$bench_dir/$mode.log"
        done
        sed -n '/^train_window=/s/ end_to_end_step_ms=.*$//p; /^validation_window=/s/ elapsed_s=.*$//p; /^holdout_reset_streaming_bpc=/s/ eval_score_seconds=.*$//p; /^test_reset_streaming_bpc=/s/ checkpoint=.*$//p' "$bench_dir/fresh.log" >"$bench_dir/fresh.metrics"
        sed -n '/^train_window=/s/ end_to_end_step_ms=.*$//p; /^validation_window=/s/ elapsed_s=.*$//p; /^holdout_reset_streaming_bpc=/s/ eval_score_seconds=.*$//p; /^test_reset_streaming_bpc=/s/ checkpoint=.*$//p' "$bench_dir/reused.log" >"$bench_dir/reused.metrics"
        diff -u "$bench_dir/fresh.metrics" "$bench_dir/reused.metrics"
        cmp "$bench_dir/fresh.ckpt" "$bench_dir/reused.ckpt"
        cmp "$bench_dir/fresh.best.ckpt" "$bench_dir/reused.best.ckpt"
        echo "PASS: fresh and reused holdout BPC/checkpoints match bit-for-bit"
        echo "NOTE: holdout_session_prepare_s is one-time setup outside training clock"

  benchmark-torus16-codegen:
    desc: Compare strict-FP32 NVPTX llc O0/O2 on GPU AdamW, fail closed on PTX translation and checkpoint mismatch
    deps: [prepare]
    cmds:
      - |
        set -eu
        bench_dir="$(mktemp -d "${TMPDIR:-/tmp}/torus16-codegen.XXXXXX")"
        trap 'status=$?; if [ "$status" -eq 0 ]; then rm -rf "$bench_dir"; else printf "Codegen logs and checkpoints retained at %s\n" "$bench_dir" >&2; fi' EXIT
        unset TORUS16_FRESH TORUS16_BPTT TORUS16_TRAIN_WINDOWS TORUS16_VAL_LIMIT TORUS16_TEST_LIMIT TORUS16_EVAL_EVERY TORUS16_CHECKPOINT_EVERY TORUS16_CORPUS TORUS16_MATRIX_MODE TORUS16_ROLE_INIT TORUS16_MATRIX_SEED TORUS16_BENCH_COMPARE TORUS16_VERIFY_FUSION TORUS16_BENCH_FUSED TORUS16_INITIAL_PROBE_PATH TORUS16_GPU_FEEDBACK_EVENTS TORUS16_THREADS_PER_BLOCK TORUS16_LLC_OPT TORUS16_METRIC_EVERY TORUS16_REUSE_HOLDOUT
        export TORUS16_GPU_ADAMW=1 TORUS16_BPTT=2 TORUS16_TRAIN_WINDOWS=256 TORUS16_VAL_LIMIT=2 TORUS16_TEST_LIMIT=2 TORUS16_EVAL_EVERY=256 TORUS16_CHECKPOINT_EVERY=256 TORUS16_THREADS_PER_BLOCK=256 TORUS16_METRIC_EVERY=32
        for opt in 0 2; do
          printf '\nllc_codegen_optimization=-O%s\n' "$opt"
          TORUS16_FRESH=1 TORUS16_LLC_OPT="$opt" TORUS16_CHECKPOINT="$bench_dir/opt$opt.ckpt" \
            cargo run --release -p torus16-mix-lab --example ema4_bptt >"$bench_dir/opt$opt.log" 2>&1 || { cat "$bench_dir/opt$opt.log"; exit 1; }
          grep '^llc_codegen_optimization=' "$bench_dir/opt$opt.log"
          grep '^training_total_s=' "$bench_dir/opt$opt.log"
          grep '^training_profile_avg_ms ' "$bench_dir/opt$opt.log"
        done
        sed -n '/^train_window=/s/ end_to_end_step_ms=.*$//p' "$bench_dir/opt0.log" >"$bench_dir/opt0.curve"
        sed -n '/^train_window=/s/ end_to_end_step_ms=.*$//p' "$bench_dir/opt2.log" >"$bench_dir/opt2.curve"
        diff -u "$bench_dir/opt0.curve" "$bench_dir/opt2.curve"
        cmp "$bench_dir/opt0.ckpt" "$bench_dir/opt2.ckpt"
        cmp "$bench_dir/opt0.best.ckpt" "$bench_dir/opt2.best.ckpt"
        echo "PASS: O2 matches O0 sample-by-sample and preserves final and best checkpoints bit-for-bit"
        echo "NOTE: O2 remains experimental; rerun benchmarks to confirm speed and use a separate resume regression"

  benchmark-torus16-throughput:
    desc: GPU AdamW throughput tuning; compare optional sparse loss readback and CUDA block size, require bitwise checkpoint parity
    deps: [prepare]
    cmds:
      - |
        set -eu
        bench_dir="$(mktemp -d "${TMPDIR:-/tmp}/torus16-throughput.XXXXXX")"
        trap 'status=$?; if [ "$status" -eq 0 ]; then rm -rf "$bench_dir"; else printf "Benchmark logs retained at %s\n" "$bench_dir" >&2; fi' EXIT
        unset TORUS16_FRESH TORUS16_BPTT TORUS16_TRAIN_WINDOWS TORUS16_VAL_LIMIT TORUS16_TEST_LIMIT TORUS16_EVAL_EVERY TORUS16_CHECKPOINT_EVERY TORUS16_CORPUS TORUS16_MATRIX_MODE TORUS16_ROLE_INIT TORUS16_MATRIX_SEED TORUS16_BENCH_COMPARE TORUS16_VERIFY_FUSION TORUS16_BENCH_FUSED TORUS16_INITIAL_PROBE_PATH TORUS16_GPU_FEEDBACK_EVENTS
        export TORUS16_GPU_ADAMW=1 TORUS16_BPTT=2 TORUS16_TRAIN_WINDOWS=256 TORUS16_VAL_LIMIT=2 TORUS16_TEST_LIMIT=2 TORUS16_EVAL_EVERY=256 TORUS16_CHECKPOINT_EVERY=256
        for choice in "256 1" "256 32" "64 32" "128 32" "512 32"; do
          set -- $choice
          threads="$1"; metric_every="$2"
          label="${threads}_${metric_every}"
          printf '\nthreads=%s metric_every=%s\n' "$threads" "$metric_every"
          TORUS16_FRESH=1 TORUS16_THREADS_PER_BLOCK="$threads" TORUS16_METRIC_EVERY="$metric_every" TORUS16_CHECKPOINT="$bench_dir/$label.ckpt" \
            cargo run --release -p torus16-mix-lab --example ema4_bptt >"$bench_dir/$label.log" 2>&1 || { cat "$bench_dir/$label.log"; exit 1; }
          grep '^training_total_s=' "$bench_dir/$label.log"
          grep '^training_profile_avg_ms ' "$bench_dir/$label.log"
          grep '^cuda_graph_before=' "$bench_dir/$label.log"
        done
        cmp "$bench_dir/256_1.ckpt" "$bench_dir/256_32.ckpt"
        cmp "$bench_dir/256_1.best.ckpt" "$bench_dir/256_32.best.ckpt"
        echo "PASS: metric sampling preserves parameters, optimizer moments, states and validation selection bit-for-bit"
        echo "NOTE: compare tokens/s, not nvidia-smi utilisation; different block sizes require their own NVIDIA parity check"

  benchmark-gpu-adamw:
    desc: Compare sustained host/GPU AdamW throughput on the same EMA4 four-layer BPTT graph (256 windows)
    deps: [prepare]
    cmds:
      - |
        set -eu
        bench_dir="$(mktemp -d "${TMPDIR:-/tmp}/verineural-adamw-bench.XXXXXX")"
        trap 'status=$?; if [ "$status" -eq 0 ]; then rm -rf "$bench_dir"; else printf "Benchmark logs retained at %s\n" "$bench_dir" >&2; fi' EXIT
        unset TORUS16_FRESH TORUS16_GPU_ADAMW TORUS16_MATRIX_MODE TORUS16_ROLE_INIT TORUS16_MATRIX_SEED TORUS16_EVAL_EVERY TORUS16_TEST_LIMIT TORUS16_INITIAL_PROBE_PATH TORUS16_CORPUS TORUS16_VERIFY_FUSION TORUS16_BENCH_COMPARE TORUS16_BENCH_FUSED TORUS16_METRIC_EVERY TORUS16_THREADS_PER_BLOCK TORUS16_LLC_OPT TORUS16_REUSE_HOLDOUT
        export TORUS16_BPTT=2 TORUS16_TRAIN_WINDOWS=256 TORUS16_VAL_LIMIT=2 TORUS16_CHECKPOINT_EVERY=128 TORUS16_BENCH_FUSED=1
        echo "Benchmark: host AdamW (256 windows)"
        TORUS16_FRESH=1 TORUS16_CHECKPOINT="$bench_dir/host.ckpt" \
          cargo run --release -p torus16-mix-lab --example ema4_bptt >"$bench_dir/host.log" 2>&1 || { cat "$bench_dir/host.log"; exit 1; }
        echo "Benchmark: GPU IR AdamW (256 windows; finite-domain D2H validation)"
        TORUS16_FRESH=1 TORUS16_GPU_ADAMW=1 TORUS16_CHECKPOINT="$bench_dir/device.ckpt" \
          cargo run --release -p torus16-mix-lab --example ema4_bptt >"$bench_dir/gpu.log" 2>&1 || { cat "$bench_dir/gpu.log"; exit 1; }
        echo "Host result:"
        grep '^training_total_s=' "$bench_dir/host.log"
        grep '^training_profile_avg_ms ' "$bench_dir/host.log"
        grep '^fused_cuda_graph_event_average_ms=' "$bench_dir/host.log"
        grep '^cuda_graph_before=' "$bench_dir/host.log"
        echo "GPU result:"
        grep '^training_total_s=' "$bench_dir/gpu.log"
        grep '^training_profile_avg_ms ' "$bench_dir/gpu.log"
        grep '^fused_cuda_graph_event_average_ms=' "$bench_dir/gpu.log"
        grep '^cuda_graph_before=' "$bench_dir/gpu.log"
        if ! grep -Eq '^cuda_graph_before=.* diamond_fusions=[1-9][0-9]* ' "$bench_dir/gpu.log"; then
          echo "FAIL: GPU AdamW did not activate the required observable-output diamond fusion" >&2
          exit 1
        fi
        echo "NOTE: end-to-end throughput is authoritative; GPU optimizer adds IR kernels and may be slower."

  verify-torus16-matrix-initial:
    desc: NVIDIA bitwise parity between independently initialized W and Torus16-Mix tied W, before training (Rust only)
    deps: [prepare]
    cmds:
      - cargo test -p torus16-mix-lab --test ema4 torus_matrix_modes_initial_gpu_logits_and_state_match_bits -- --ignored --nocapture

  verify-torus16-matrix-gradients:
    desc: "NVIDIA numerical VJP check: shared W gradient equals sum of eight independent role gradients"
    deps: [prepare]
    cmds:
      - cargo test -p torus16-mix-lab --test ema4 torus_role_matrix_gradients_sum_to_shared_gradient -- --ignored --nocapture

  verify-torus16-matrix-training:
    desc: Full 2-step BPTT, fused/unfused GPU gradient parity, AdamW, and exact independent/shared checkpoint-resume
    deps: [prepare]
    cmds:
      - |
        set -eu
        dir="$(mktemp -d "${TMPDIR:-/tmp}/vn-matrix-train-test.XXXXXX")"
        trap 'status=$?; if [ "$status" -eq 0 ]; then rm -rf "$dir"; else echo "GPU training test logs at $dir" >&2; fi' EXIT
        unset TORUS16_CORPUS TORUS16_FRESH TORUS16_INITIAL_PROBE_PATH TORUS16_BENCH_COMPARE TORUS16_BENCH_FUSED TORUS16_GPU_FEEDBACK_EVENTS TORUS16_METRIC_EVERY TORUS16_THREADS_PER_BLOCK TORUS16_LLC_OPT TORUS16_REUSE_HOLDOUT
        export TORUS16_GPU_ADAMW=1 TORUS16_VERIFY_FUSION=1 TORUS16_BPTT=2
        export TORUS16_VAL_LIMIT=2 TORUS16_TEST_LIMIT=2 TORUS16_EVAL_EVERY=2 TORUS16_CHECKPOINT_EVERY=2
        export TORUS16_MATRIX_SEED=0 TORUS16_ROLE_INIT=matched
        for mode in torus_shared independent; do
          export TORUS16_MATRIX_MODE="$mode"
          TORUS16_INITIAL_PROBE_PATH="$dir/$mode.initial-probe" \
            TORUS16_FRESH=1 TORUS16_TRAIN_WINDOWS=2 TORUS16_CHECKPOINT="$dir/$mode-resumed.ckpt" \
            cargo run --release -p torus16-mix-lab --example ema4_bptt >"$dir/$mode-start.log" 2>&1 || {
              tail -n 80 "$dir/$mode-start.log"; exit 1;
            }
          grep -q '^fusion_parity=PASS ' "$dir/$mode-start.log"
          TORUS16_TRAIN_WINDOWS=4 TORUS16_CHECKPOINT="$dir/$mode-resumed.ckpt" \
            cargo run --release -p torus16-mix-lab --example ema4_bptt >"$dir/$mode-resume.log" 2>&1 || {
              tail -n 80 "$dir/$mode-resume.log"; exit 1;
            }
          TORUS16_FRESH=1 TORUS16_TRAIN_WINDOWS=4 TORUS16_CHECKPOINT="$dir/$mode-continuous.ckpt" \
            cargo run --release -p torus16-mix-lab --example ema4_bptt >"$dir/$mode-continuous.log" 2>&1 || {
              tail -n 80 "$dir/$mode-continuous.log"; exit 1;
            }
          cmp "$dir/$mode-resumed.ckpt" "$dir/$mode-continuous.ckpt"
          grep '^holdout_reset_streaming_bpc=' "$dir/$mode-resume.log"
          grep '^test_reset_streaming_bpc=' "$dir/$mode-resume.log"
          echo "PASS: $mode two-step BPTT/GPU AdamW parity and bitwise resume"
        done
        cmp "$dir/torus_shared.initial-probe" "$dir/independent.initial-probe"
        echo "PASS: initial training BPTT logits and terminal states bitwise-equal across architectures"

  compare-torus16-matrix-tying:
    desc: Resumable seeded Rust/VeriNeural Torus16-Mix LM ablation with train/validation curves
    deps: [prepare]
    cmds:
      - |
        set -eu
        unset TORUS16_VERIFY_FUSION TORUS16_BENCH_COMPARE TORUS16_BENCH_FUSED TORUS16_GPU_FEEDBACK_EVENTS
        out="${TORUS16_MATRIX_ABLATION_DIR:-target/torus16-matrix-ablation}"
        mkdir -p "$out"
        export TORUS16_BPTT="${TORUS16_BPTT:-2}"
        export TORUS16_TRAIN_WINDOWS="${TORUS16_TRAIN_WINDOWS:-65536}"
        export TORUS16_VAL_LIMIT="${TORUS16_VAL_LIMIT:-4096}"
        export TORUS16_TEST_LIMIT="${TORUS16_TEST_LIMIT:-4096}"
        unset TORUS16_INITIAL_PROBE_PATH
        export TORUS16_EVAL_EVERY="${TORUS16_EVAL_EVERY:-8192}"
        export TORUS16_CHECKPOINT_EVERY="${TORUS16_CHECKPOINT_EVERY:-4096}"
        export TORUS16_GPU_ADAMW=1
        # Default is one paired matched-W seed. Set MATRIX_SEEDS="1 2 3"
        # for replicate trials, INCLUDE_DIVERSE=1 for the independent-W
        # baseline, and MATRIX_ABLATION_FRESH=1 for an explicit fresh run.
        if [ "${TORUS16_MATRIX_ABLATION_FRESH:-0}" = 1 ]; then
          export TORUS16_FRESH=1
        else
          unset TORUS16_FRESH
        fi
        for seed in ${TORUS16_MATRIX_SEEDS:-0}; do
          case "$seed" in ''|*[!0-9]*) echo "Invalid uint64 seed: $seed" >&2; exit 1;; esac
          variants="torus_shared:matched independent:matched"
          if [ "${TORUS16_INCLUDE_DIVERSE:-0}" = 1 ]; then
            variants="$variants independent:diverse"
          fi
          for variant in $variants; do
            mode="${variant%%:*}"
            init="${variant#*:}"
            tag="$mode-$init-seed$seed"
            log="$out/$tag.log"
            echo "Torus16-Mix training: $tag (windows=$TORUS16_TRAIN_WINDOWS, BPTT=$TORUS16_BPTT, validation=$TORUS16_VAL_LIMIT)"
            if [ -n "${TORUS16_FRESH:-}" ] || [ ! -f "$out/$tag.ckpt" ]; then
              : >"$log"
            fi
            TORUS16_MATRIX_MODE="$mode" TORUS16_ROLE_INIT="$init" TORUS16_MATRIX_SEED="$seed" \
              TORUS16_CHECKPOINT="$out/$tag.ckpt" \
              cargo run --release -p torus16-mix-lab --example ema4_bptt >>"$log" 2>&1 || {
                tail -n 100 "$log"
                echo "FAIL: $tag; full log in $log" >&2
                exit 1
              }
            grep '^experiment_matrix_mode=' "$log" | tail -n 1
            grep '^training_total_s=' "$log" | tail -n 1
            grep '^holdout_reset_streaming_bpc=' "$log" | tail -n 1
            grep '^test_reset_streaming_bpc=' "$log" | tail -n 1
            grep '^train_curve_window=' "$log" >"$out/$tag.train_curve.log"
            grep '^validation_window=' "$log" >"$out/$tag.validation_curve.log"
          done
        done
        echo "PASS: matched-seed Torus16-Mix pair evaluated; results at $out"
        echo "best checkpoints: $out/*.best.ckpt"

  autodiff-stage:
    desc: Validate architecture-neutral reverse-mode IR rules, finite difference checks and atomic AdamW
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test autodiff

  verify-gpu-autodiff:
    desc: Validate reverse-mode MatMul/fanout gradients through CUDA Graph against independent oracle
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test autodiff -- --ignored --nocapture

  train-lab-torus16-ema4:
    desc: GPU CE to reverse-IR VJP to host AdamW, one-token truncated gradient for final-beta only
    deps: [prepare]
    cmds:
      - cargo run -p torus16-mix-lab --example ema4_train

  lab-torus16-ema4:
    desc: Inspect the 4-layer streaming EMA4-LM architecture built from VeriNeural primitives
    deps: [prepare]
    cmds:
      - cargo run -p torus16-mix-lab --example ema4 -- --inspect

  test-lab-torus16-ema4:
    desc: Validate research-sized parameter count, all named states and causal CPU reference
    deps: [prepare]
    cmds:
      - cargo test -p verineural --test pointwise_gpu
      - cargo test -p torus16-mix-lab --test ema4

  lab-torus16-ema4-gpu:
    desc: Execute three EMA4-LM autoregressive steps through one persistent CUDA Graph
    deps: [prepare]
    cmds:
      - cargo run -p torus16-mix-lab --example ema4 -- --gpu

  verify-gpu-torus16-ema4:
    desc: NVIDIA acceptance for streaming EMA4-LM logits and on-device EMA feedback
    deps: [prepare]
    cmds:
      - cargo test -p torus16-mix-lab --test ema4 -- --ignored --nocapture

  certify-lab-torus16-mix:
    desc: Fail closed on unsupported certified numerical semantics of pointwise Exp/Div
    deps: [prepare]
    cmds:
      - cargo run -p torus16-mix-lab --example torus16_mix -- --certify

